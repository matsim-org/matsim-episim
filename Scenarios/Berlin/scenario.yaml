# Influenza scenario Berlin, read by RunInfluenza (see ScenarioDescriptor). config.xml, progression.conf and
# policy.conf are written by org.matsim.episim.run.scenarios.berlin.GenerateInfluenzaConfig.
city: Berlin
country: DE
region: Berlin
observed:
  - name: Influenza notifications Berlin (RKI IfSG)
    file: berlin-ifsg-influenza-2025-26.tsv
    value: cases
    unit: count
    # Fallzahl / Inzidenz of the RKI series in the 2025/26 season
    population: 3705000
    plot: casCom
  - name: Influenza SARI hospitalisations Germany (RKI ICOSARI)
    file: germany-icosari-influenza-sari-2025-26.tsv
    value: incidence
    unit: per100k
    plot: hospNewCas
weather:
  daily: berlin-weather-2025-26.csv
  average: berlin-weather-avg-1996-2025.csv
