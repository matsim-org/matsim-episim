# Builds the matsim-episim image and publishes it to ghcr.io/<owner>/matsim-episim.
# Tags: sha-<commit> for every build, the branch name, and the version for a v* tag (v2027.0 -> 2027.0). No latest.
# The digest of the pushed image is in the job summary; use image@sha256:... to record a run.
name: container

on:
  push:
    branches: [master, js/Influenza]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/matsim-episim
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=match,pattern=v(.*),group=1

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_DIRTY=false
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image"
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/matsim-episim@${{ steps.build.outputs.digest }}"
            echo '```'
            echo "commit \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
